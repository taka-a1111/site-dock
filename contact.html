    <button class="menu-btn" type="button" aria-expanded="false" aria-controls="gnav"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><line x1="4" y1="7" x2="20" y2="7"/><line x1="4" y1="12" x2="20" y2="12"/><line x1="4" y1="17" x2="20" y2="17"/></svg><span>メニュー</span></button>

<main id="main">
  <div class="page-hero"><div class="wrap">
    <nav class="crumbs" aria-label="現在地"><a href="./">トップ</a> / お問い合わせ</nav>
    <h1>お問い合わせ</h1>
    <p>詳細診断、定期診断、対策作業、制作会社さま向けのご相談はこちらから。平日2営業日以内にお返事します。</p>
  </div></div>
<section class="sub-sec"><div class="wrap two-col">
  <form class="cform" data-contact-form>
    <div><label for="c-company">会社名・屋号<span class="opt">任意</span></label><input id="c-company" type="text" autocomplete="organization"></div>
    <div><label for="c-name">お名前<span class="req">必須</span></label><input id="c-name" type="text" autocomplete="name" required></div>
    <div><label for="c-mail">メールアドレス<span class="req">必須</span></label><input id="c-mail" type="email" autocomplete="email" required></div>
    <div><label for="c-tel">電話番号<span class="opt">任意</span></label><input id="c-tel" type="tel" autocomplete="tel"></div>
    <div><label for="c-url">対象サイトのURL<span class="opt">任意</span></label><input id="c-url" type="url" inputmode="url" placeholder="https://www.example.com"></div>
    <div><label for="c-kind">ご相談の種類<span class="req">必須</span></label><select id="c-kind" required><option value="">選んでください</option><option>詳細診断を申し込みたい</option><option>定期診断を申し込みたい</option><option>対策作業を頼みたい</option><option>改ざんされたかもしれない（急ぎ）</option><option>制作会社・保守会社としての相談</option><option>そのほか</option></select></div>
    <div><label for="c-body">ご相談の内容<span class="req">必須</span></label><textarea id="c-body" required></textarea></div>
    <label class="agree" for="c-agree"><input id="c-agree" type="checkbox" required><span><a href="privacy.html">プライバシーポリシー</a>に同意します</span></label>
    <button class="btn btn-submit" type="submit">送信する</button>
    <input type="text" name="website" tabindex="-1" autocomplete="off" aria-hidden="true" style="position:absolute;left:-9999px;width:1px;height:1px">
    <p class="form-msg" role="status"></p>
  </form>
  <div class="contact-side">
    <div class="note-box"><b style="color:var(--ink)">改ざんされたかもしれないとき</b><br>ご相談の種類で「改ざんされたかもしれない（急ぎ）」を選んでください。届いた順ではなく、急ぎのものから先にお返事します。</div>
    <div class="note-box"><b style="color:var(--ink)">まず状態を知りたいとき</b><br>お問い合わせの前に、<a href="./#top">無料簡易診断</a>を試していただくと、ご相談がスムーズです。</div>
  </div>
</div></section>
